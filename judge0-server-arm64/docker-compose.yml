version: "3.8"

services:
  server:
    image: itspr/judge0:arm64
    platform: linux/arm64
    env_file: judge0.conf
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: always
    # depends_on:
    #   - db
    #   - redis
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

